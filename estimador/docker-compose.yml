# Docker Compose configuration for local development.
# For production, remove the bind mount and the --reload flag.

services:
  estimator:
    build: .
    container_name: estimator
    ports:
      - "8000:8000"

    # Load environment variables (API keys, config) from the local .env file.
    env_file:
      - .env

    # Override service URLs for the in-network services. The .env values are
    # meant for running uvicorn outside Docker.
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+psycopg://estimator:estimator@estimator-postgres:5432/estimator

    depends_on:
      redis:
        condition: service_healthy
      estimator-postgres:
        condition: service_healthy

    # Bind-mount code, tests, data and migrations so changes survive restarts
    # without rebuilding the image.
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    # Apply pending migrations on startup, then run uvicorn with auto-reload.
    # Remove --reload for production deployments.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    restart: unless-stopped

    # Health check using Python's stdlib (curl is not available in slim images).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    # Redis Stack bundles the RediSearch + RedisJSON modules that redisvl uses
    # to do vector similarity queries for the semantic cache. The vanilla
    # ``redis:7-alpine`` image does NOT ship these modules.
    image: redis/redis-stack:7.4.0-v0
    container_name: estimator-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Session 6 — Postgres for pseudonym mappings + ingestion jobs.
  # pgvector/pgvector:pg16 ships pgvector compiled; it stays dormant until S07.
  estimator-postgres:
    image: pgvector/pgvector:pg16
    container_name: estimator-postgres
    environment:
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
      POSTGRES_DB: estimator
    ports:
      # 5433 on the host to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - estimator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "estimator", "-d", "estimator"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  estimator_postgres_data:

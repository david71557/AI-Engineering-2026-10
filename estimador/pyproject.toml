[project]
name = "estimador-cag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "structlog>=24.0",
    "streamlit>=1.40",
    "litellm>=1.50",
    "redis>=8.1.0",
    "jinja2>=3.1.6",
    "redisvl>=0.3",
    "numpy>=2.4.6",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    # Session 6 — data-driven AI (cleaning + validation)
    "pandas>=2.2",
    "pandera>=0.20",
    "pyyaml>=6.0",
    # Session 6 — persistence (Postgres + Alembic)
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "openpyxl>=3.1",
    # Session 6 — PII pseudonymization (Presidio + Spanish spaCy model)
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.8,<3.9",
    "es-core-news-md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl",
    "faker>=24.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.7",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Only our suite: the ai-engineering-session_* copies have their own tests.
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "estimador-cag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "structlog>=24.0",
    "streamlit>=1.40",
    "litellm>=1.50",
    "redis>=8.1.0",
    "jinja2>=3.1.6",
    "redisvl>=0.3",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Only our suite: the ai-engineering-session_* copies have their own tests.
testpaths = ["tests"]
pythonpath = ["."]
